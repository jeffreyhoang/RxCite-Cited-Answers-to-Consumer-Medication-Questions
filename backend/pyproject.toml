[project]
name = "rxcite"
version = "0.1.0"
description = "Cited answers to consumer medication questions using RAG over openFDA drug labels"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.15.0",
    "fastapi>=0.165.0",
    "numpy>=2.5.4",
    "openai>=3.51.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.3.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rxcite"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so tests can import the api package (backend/api)

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
