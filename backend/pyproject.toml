[project]
name = "rxcite"
version = "0.1.0"
description = "Cited answers to consumer medication questions using RAG over openFDA drug labels"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.15.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rxcite"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
